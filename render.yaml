services:
  - type: web
    name: ryadom-microgigs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_YANDEX_MAPS_API_KEY
        sync: false
      - key: YANDEX_GEOCODER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: SMS_PROVIDER
        value: disabled
